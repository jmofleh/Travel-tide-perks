name: Sync to Hugging Face hub
on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true  # This checks out LFS files, but doesn't configure LFS for pushing
      
      - name: Configure Git LFS
        run: |
          git lfs install
          git lfs track "*.csv"
          git lfs track "data/processed/*.csv"
          git add .gitattributes
          
      - name: Push to hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "github-actions@github.com"
          git config --global user.name "GitHub Actions"
          
          # Make sure LFS files are properly tracked before pushing
          git lfs status
          
          # Push with LFS
          git push --force "https://JAM14:${{ secrets.HF_TOKEN }}@huggingface.co/spaces/JAM14/travel_tide_perks" HEAD:refs/heads/main
